[tool.poetry]
name = "verbilo"
version = "1.13"
description = "Translate .docx, .pdf, and .xlsx files while preserving formatting."
authors = ["crt_ (8041q)"]
packages = [{ include = "verbilo", from = "src" }]
include = [
    { path = "src/verbilo/assets/**/*", format = ["wheel", "sdist"] },
    { path = "models/**/*", format = ["wheel", "sdist"] }
]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/8041q/Verbilo"
homepage = "https://github.com/8041q/Verbilo"

[tool.verbilo]
build_date = "2026-09-12"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# Document converters
python-docx = "==0.8.11"
lxml = "==6.0.2"
openpyxl = "==3.1.2"

# PDF
PyMuPDF = "==1.27.2"
pymupdf-fonts = "==1.0.5"

# Translation
deep-translator = "==1.11.4"

# Language detection
lingua-language-detector = "==2.1.1"
fast-langdetect = "==1.0.0"

# Local offline translation (OPUS-MT via CTranslate2)
ctranslate2 = "==4.7.1"
sentencepiece = "==0.2.1"

# GUI / theme
customtkinter = "==5.2.2"
pytablericons = "==1.0.1"
tkinterdnd2 = "==0.6.3"

# System / runtime
platformdirs = "==4.9.4"
tomli = "==2.4.0"

urllib3 = "==2.6.2"
requests = "==2.32.5"
google-cloud-translate = "==3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
nuitka = "^4.0.7"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
